# Garante que PRs para a main venham somente da branch `develop`.
# Rulesets/branch protection não estão disponíveis (repo privado em org free),
# então este workflow é o guard do fluxo develop -> main no lado do CI.

name: "Guard: PR to main only from develop"

on:
  pull_request:
    # edited cobre retarget de base pela UI (PR aberto pra outra branch,
    # depois trocado pra main) -- sem isso passaria sem checar.
    types: [opened, reopened, edited, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  check-base:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que a branch de origem é develop
        run: |
          HEAD_REF="${{ github.event.pull_request.head.ref }}"

          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::PRs para main devem vir somente de develop. Branch de origem atual: '$HEAD_REF'."
            exit 1
          fi

          echo "OK: PR para main vem de develop."
