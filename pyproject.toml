[project]
name = "churn-prediction"
version = "0.1.0"
description = "Previsão de churn (Telco/IBM) com Scikit-Learn, pipeline de pré-processamento e API FastAPI."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "pandera>=0.20",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "mlflow>=2.12",
    "dagshub>=0.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pre-commit>=3.7",
    "commitizen>=3.27",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
update_changelog_on_bump = true
version_files = [
    "pyproject.toml:version",
    "src/__init__.py:__version__",
]
